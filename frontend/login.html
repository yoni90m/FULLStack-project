<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — TransLink Bus Transportation System</title>
  <meta name="description" content="Sign in to your TransLink account to manage bus operations or book trips.">
  <link rel="icon" type="image/jpeg" href="assets/icons/translink-icon.jpg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">
          <img src="assets/icons/translink-icon.jpg" alt="TransLink Logo">
          <span>Trans<span style="color: #0ea5e9;">Link</span></span>
        </a>
        <h1>Welcome Back</h1>
        <p>Sign in to access your transportation portal</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Username or Email <span class="required">*</span></label>
          <input type="text" id="login-email" class="form-control" placeholder="admin or admin@translink.com" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.35rem;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
          </div>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-login-submit" class="btn-submit-action">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html" style="font-weight: 700;">👤 Register as Passenger</a></p>
        <div style="margin-top: 0.5rem;">
          <a href="index.html" style="color: #64748b; font-size: 0.8rem;">← Back to Homepage</a>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
